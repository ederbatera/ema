version: '3.8'

# ==============================================================================
# METEOPULSE PRO EMA — DOCKER COMPOSE (Desenvolvimento & Testes Locais)
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meteopulse-ema:latest
    container_name: meteopulse_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - meteo_network
    volumes:
      - meteo_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: meteopulse_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meteo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  meteo_network:
    driver: bridge

volumes:
  meteo_data:
  redis_data:
